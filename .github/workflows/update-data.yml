name: Update Tax Data
# Runs daily + on manual trigger — fetches fresh NPC API results for 12 tax types

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
  workflow_dispatch:

concurrency:
  group: update-tax-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repo default GITHUB_TOKEN is read-only; declare write so the
    # final "git push" below is allowed (403 otherwise).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3

      - name: Fetch tax data
        # Exits 1 (blocking the commit below) only if every search fails;
        # partial failures reuse the previous run's data instead of wiping it.
        run: python .github/scripts/fetch_tax_data.py

      - name: Fetch extra sources
        # fgk.chinatax.gov.cn latest documents + accounting standards
        # (kjs.mof.gov.cn / casc.org.cn). Never blocks the commit: failures
        # reuse the previous run's files.
        run: python .github/scripts/fetch_extra_sources.py

      - name: Build law version chains
        # 20 tax-law families: search all effect statuses, verify repeal
        # clauses from law DOCX text, write docs/data/versions.json.
        run: python scripts/tax_versions.py --build --out docs/data/versions.json

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || (git commit -m "data: auto-update tax search results" && git push)
